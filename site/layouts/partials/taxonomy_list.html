<section class="taxonomy-section">
    <h2 class="taxonomy-section__title">
    {{ .Title }}
  </h2>

  <div class="taxonomy-section__grid">
    {{ $type := .Type }}
    {{ range $term, $taxonomy := .Taxonomy }}
      {{ if ge (len $taxonomy.Pages) 15 }}
        <div class="taxonomy-section__item">
          <span class="taxonomy-section__icon">📁</span>
          <div>
            <a href="{{ (site.GetPage (printf "/%s/%s" $type $term)).RelPermalink }}"
               class="taxonomy-section__link">
              {{ $term }}
            </a>
            <sup class="taxonomy-section__count">{{ len $taxonomy.Pages }}</sup>
          </div>
        </div>
      {{ end }}
    {{ end }}
  </div>
</section>
